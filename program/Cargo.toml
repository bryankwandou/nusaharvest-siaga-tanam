[package]
name = "nusaharvest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.7.0"

# Off-chain builds (cargo check, host tests) need the curve25519 backend for PDA derivation;
# on-chain the syscalls are used instead.
[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[dev-dependencies]
litesvm = "=0.16.0"
solana-account = "4"
solana-address = { version = "2", features = ["curve25519"] }
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace]
